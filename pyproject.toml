[project]
name = "ury"
authors = [
    { name = "Tridz Technologies", email = "info@tridz.com"}
]
description = "A Complete Restaurant Order Taking Software"
requires-python = ">=3.10,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    # Real third-party packages the app itself imports (previously undeclared
    # anywhere; versions intentionally unpinned so they resolve against
    # whatever frappe itself already pins).
    "click",
    "cryptography",
    "python-dateutil",
    "pypdf",
    "pytz",
    "requests",
]

[project.optional-dependencies]
# Only needed if URY Printer Settings is configured to print via CUPS
# (ury/ury/api/ury_print.py); requires the system "cups" dev package too.
cups-printing = ["pycups"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
# NOTE: intentionally left at the v15 range. Do not widen to include v16
# until the Phase 2-5 fixes in the v16 remediation plan are verified on a
# real v16 bench — see https://claude.ai/artifact/6baV3JuVYsgZ1w8UYvJKeY
frappe = ">=15.0.0,<16.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
